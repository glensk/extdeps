[project]
name = "extdeps"
version = "0.1.0"
description = "Declare → resolve → fail-loud registry for external tool dependencies (sibling repos' scripts, system executables)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Albert Glensk" }]
keywords = ["cli", "dependencies", "resolver", "which"]

[project.urls]
Homepage = "https://github.com/glensk/extdeps"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["extdeps"]

[dependency-groups]
dev = ["pytest>=8"]

# A project ruff config (the fallback user config's `src` is the caller's cwd, so a
# check run from elsewhere filed `extdeps` as third-party: I001 in the tests). `select`
# mirrors the pre-commit gate (E,F,W,I minus E501), as a project config replaces it.
[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["extdeps"]
